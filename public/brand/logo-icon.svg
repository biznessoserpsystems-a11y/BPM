<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background — the app's own UI already draws a white
       rounded badge behind this icon (see sidebar-nav.tsx /
       login-overlay.tsx), so no background is baked in here. -->

  <!-- Device body: capsule/pill-shaped phone silhouette -->
  <g transform="translate(250 250)">
    <!-- Outer capsule shape (top: green pill half, bottom: navy phone body) -->
    <path d="
      M -75 -170
      C -75 -205 -42 -225 0 -225
      C 42 -225 75 -205 75 -170
      L 75 165
      C 75 195 42 220 0 220
      C -42 220 -75 195 -75 165
      Z"
      fill="#0a2e52"/>

    <!-- Green pill-cap top half -->
    <path d="
      M -75 -170
      C -75 -205 -42 -225 0 -225
      C 42 -225 75 -205 75 -170
      L 75 -55
      L -75 -55
      Z"
      fill="#1a9e4e"/>
    <!-- subtle lighter highlight on the green cap -->
    <path d="
      M -75 -170
      C -75 -205 -42 -225 0 -225
      C 30 -225 55 -212 66 -192
      C 40 -205 5 -208 -25 -196
      C -50 -186 -65 -168 -70 -150
      L -75 -150 Z"
      fill="#3dc172" opacity="0.55"/>

    <!-- small decorative leaf/wing accents at the very top (echoes a mortar-and-pestle / rx flourish) -->
    <path d="M -18 -222 C -34 -216 -42 -204 -40 -196 C -30 -200 -18 -210 -14 -220 Z" fill="#eafff2"/>
    <path d="M 18 -222 C 34 -216 42 -204 40 -196 C 30 -200 18 -210 14 -220 Z" fill="#eafff2"/>

    <!-- Screen: rounded rect with a medical cross -->
    <rect x="-46" y="-140" width="92" height="62" rx="14" fill="#12703a"/>
    <g fill="#eafff2">
      <rect x="-8" y="-124" width="16" height="30" rx="4"/>
      <rect x="-23" y="-109" width="46" height="16" rx="4"/>
    </g>

    <!-- Keypad: 3x3 grid of rounded dots on the navy body -->
    <g fill="#eafff2">
      <circle cx="-38" cy="-38" r="10"/>
      <circle cx="0"   cy="-38" r="10"/>
      <circle cx="38"  cy="-38" r="10"/>
      <circle cx="-38" cy="2"   r="10"/>
      <circle cx="0"   cy="2"   r="10"/>
      <circle cx="38"  cy="2"   r="10"/>
      <circle cx="-38" cy="42"  r="10"/>
      <circle cx="0"   cy="42"  r="10"/>
      <circle cx="38"  cy="42"  r="10"/>
    </g>

    <!-- Speaker slit near the bottom -->
    <rect x="-24" y="188" width="48" height="8" rx="4" fill="#eafff2" opacity="0.85"/>
  </g>
</svg>
